<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar Sesión - SpaceHub</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

<!-- barra de navegacion / navbar -->
<nav class="navbar navbar-expand-lg sticky-top">
  <div class="container">
    <a class="navbar-brand" href="index.html">
      <i class="bi bi-building"></i> SpaceHub
    </a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="menu">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item"><a class="nav-link" href="index.html">Inicio</a></li>
        <li class="nav-item"><a class="nav-link" href="catalogo.html">Catálogo</a></li>
        <li class="nav-item"><a class="nav-link" href="contacto.html">Contacto</a></li>
        <li class="nav-item">
          <a class="nav-link active" href="login.html"><i class="bi bi-person"></i> Iniciar sesión</a>
        </li>
      </ul>
    </div>
  </div>
</nav>

<!-- formulario de inicio de sesion (card) -->
<section class="py-5">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-12 col-md-6 col-lg-4">
        <div class="card p-4">
          <div class="text-center mb-4">
            <i class="bi bi-person-circle fs-1 text-secondary"></i>
            <h3 class="mt-2">Iniciar Sesión</h3>
            <p class="text-muted small">Ingresa tus credenciales para acceder.</p>
          </div>

          <form onsubmit="verificarIngreso(event)">
            <div class="mb-3">
              <label class="form-label small fw-bold">Correo electrónico</label>
              <input type="email" id="correoLogin" class="form-control" placeholder="usuario@correo.com" required>
            </div>
            <div class="mb-3">
              <label class="form-label small fw-bold">Contraseña</label>
              <input type="password" id="claveLogin" class="form-control" placeholder="••••••••" required>
            </div>
            <div class="mb-3 form-check">
              <input type="checkbox" class="form-check-input" id="recordar">
              <label class="form-check-label small" for="recordar">Recordar mi sesión</label>
            </div>
            <button type="submit" class="btn btn-primary w-100 mb-3">Ingresar</button>

            <div class="p-2 bg-light border rounded small text-center text-muted mb-3">
              <i class="bi bi-info-circle me-1"></i> Para ingresar al panel admin: usa <strong>admin@spacehub.pe</strong>
            </div>

            <p class="text-center small text-muted mb-0">
              ¿No tienes cuenta? <a href="registro.html" class="text-decoration-none fw-bold">Regístrate</a>
            </p>
          </form>
        </div>
      </div>
    </div>
  </div>
</section>

<!-- pie de pagina / footer -->
<footer class="py-4">
  <div class="container text-center small text-muted">
    © 2026 SpaceHub. Todos los derechos reservados.
  </div>
</footer>

<!-- script para verificar si ingresa admin o cliente -->
<script>
function verificarIngreso(event) {
  event.preventDefault();
  const email = document.getElementById("correoLogin").value.toLowerCase();
  if (email.includes("admin")) {
    alert("¡Bienvenido al Panel de Administración!");
    window.location.href = "admin.html";
  } else {
    alert("¡Inicio de sesión exitoso! Bienvenido a SpaceHub.");
    window.location.href = "index.html";
  }
}
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
