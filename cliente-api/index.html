<!doctype html>
<html lang="es">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SpaceHub · Consulta API</title>
<style>
body{font:16px system-ui;background:#f1f5f9;color:#17243b;margin:0}main{max-width:1050px;margin:auto;padding:40px 24px}header{background:#17243b;color:white;padding:24px;border-radius:16px}label{display:block;margin:24px 0 8px}select,button{font:inherit;padding:10px;border:1px solid #aab8c9;border-radius:8px}#espacios{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}article{background:white;border:1px solid #d7e0eb;border-radius:12px;padding:20px}h2{font-size:20px}#estado{min-height:24px}small{color:#526580}
</style>
<main><header><h1>SpaceHub</h1><p>Encuentra un espacio para tu próxima reunión o evento.</p></header>
<form id="acceso"><h2>Inicia sesión para consultar</h2><label for="correo">Correo</label><input id="correo" type="email" autocomplete="username" maxlength="100" required>
<label for="clave">Contraseña</label><input id="clave" type="password" autocomplete="current-password" maxlength="72" required><button type="submit">Ingresar</button></form>
<button id="salir" type="button" hidden>Cerrar sesión del cliente API</button>
<label for="categoria">Categoría</label><select id="categoria" disabled><option value="">Todas las categorías</option></select>
<button id="actualizar" type="button" disabled>Actualizar</button>
<p id="estado" role="status" aria-live="polite"></p><section id="espacios" aria-label="Espacios"></section>
<p><small>Demostración: cliente Node.js independiente que consulta la API REST de SpaceHub.</small></p></main>
<script>
const categoria=document.querySelector('#categoria'), estado=document.querySelector('#estado'), lista=document.querySelector('#espacios');
let version=0, token=null;
const acceso=document.querySelector('#acceso'),salir=document.querySelector('#salir'),actualizar=document.querySelector('#actualizar');
function cerrar(mensaje='Sesión del cliente cerrada.'){token=null;version++;lista.replaceChildren();categoria.replaceChildren(new Option('Todas las categorías',''));categoria.disabled=true;actualizar.disabled=true;acceso.hidden=false;salir.hidden=true;acceso.reset();estado.textContent=mensaje;}
async function consultar(ruta){const usado=token;const r=await fetch(ruta,{headers:{Authorization:'Bearer '+usado}});if(usado!==token)throw Error('Consulta cancelada.');if(r.status===401){cerrar('Tu acceso venció o fue revocado. Inicia sesión nuevamente.');throw Error('Acceso vencido.');}if(!r.ok)throw Error(r.status===502?'No se pudo conectar con SpaceHub. Inicia el servidor e intenta de nuevo.':'No se pudo completar la consulta.');return r.json();}
function texto(tag,valor){const e=document.createElement(tag);e.textContent=valor;return e;}
async function cargar(){const actual=++version;estado.textContent='Consultando espacios…';lista.replaceChildren();try{
const datos=await consultar('/api/v1/espacios'+(categoria.value?'?categoriaId='+encodeURIComponent(categoria.value):''));if(actual!==version)return;
for(const s of datos){const card=document.createElement('article');card.append(texto('h2',s.nombre),texto('p',s.categoria+' · '+s.distrito),texto('p',s.descripcion||''),texto('p',new Intl.NumberFormat('es-PE',{style:'currency',currency:s.moneda}).format(s.precioPorHora)+' por hora'),texto('p','Capacidad: '+s.capacidad+' · '+s.estado));lista.append(card);}
estado.textContent=datos.length?datos.length+' espacios encontrados.':'No hay espacios en esta categoría.';
}catch(e){if(actual===version)estado.textContent=e.message;}}
async function iniciar(){const actual=++version;try{const datos=await consultar('/api/v1/categorias');if(actual!==version)return;categoria.replaceChildren(new Option('Todas las categorías',''));for(const c of datos)categoria.add(new Option(c.nombre,c.id));await cargar();}catch(e){if(actual===version)estado.textContent=e.message;}}
acceso.addEventListener('submit',async e=>{e.preventDefault();const boton=acceso.querySelector('button');boton.disabled=true;estado.textContent='Verificando credenciales…';try{
const r=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({correo:document.querySelector('#correo').value,password:document.querySelector('#clave').value})});
if(!r.ok)throw Error(r.status===502?'No se pudo conectar con Spring Boot.':'No se pudo iniciar sesión. Revisa tus credenciales y que la cuenta esté activa.');
token=(await r.json()).access_token;document.querySelector('#clave').value='';acceso.hidden=true;salir.hidden=false;categoria.disabled=false;actualizar.disabled=false;await iniciar();
}catch(error){estado.textContent=error.message;}finally{boton.disabled=false;}});
salir.addEventListener('click',()=>{cerrar();estado.textContent='Sesión del cliente cerrada.';});
categoria.addEventListener('change',cargar);actualizar.addEventListener('click',iniciar);estado.textContent='Ingresa con una cuenta de SpaceHub.';
</script></html>
