<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro de Usuario - SpaceHub</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

<!-- barra de navegacion / navbar -->
<nav class="navbar navbar-expand-lg sticky-top">
  <div class="container">
    <a class="navbar-brand" href="index.html">
      <i class="bi bi-building"></i> SpaceHub
    </a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="menu">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item"><a class="nav-link" href="index.html">Inicio</a></li>
        <li class="nav-item"><a class="nav-link" href="catalogo.html">Catálogo</a></li>
        <li class="nav-item"><a class="nav-link" href="contacto.html">Contacto</a></li>
        <li class="nav-item">
          <a class="nav-link active" href="registro.html"><i class="bi bi-person-plus"></i> Registrarse</a>
        </li>
      </ul>
    </div>
  </div>
</nav>

<!-- formulario de registro (card) -->
<section class="py-5">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-12 col-md-8 col-lg-5">
        <div class="card p-4">
          <div class="text-center mb-4">
            <i class="bi bi-person-plus-fill fs-1 text-secondary"></i>
            <h3 class="mt-2">Crear Cuenta</h3>
            <p class="text-muted small">Regístrate para reservar o publicar espacios.</p>
          </div>

          <form action="login.html" method="GET" onsubmit="alert('¡Cuenta registrada exitosamente!');">
            <div class="row g-2 mb-3">
              <div class="col-6">
                <label class="form-label small fw-bold">Nombre</label>
                <input type="text" class="form-control" placeholder="Gerardo" required>
              </div>
              <div class="col-6">
                <label class="form-label small fw-bold">Apellidos</label>
                <input type="text" class="form-control" placeholder="Guevara" required>
              </div>
            </div>
            <div class="mb-3">
              <label class="form-label small fw-bold">Correo electrónico</label>
              <input type="email" class="form-control" placeholder="tu@correo.com" required>
            </div>
            <div class="mb-3">
              <label class="form-label small fw-bold">Teléfono / WhatsApp</label>
              <input type="tel" class="form-control" placeholder="987654321" required>
            </div>
            <div class="mb-3">
              <label class="form-label small fw-bold">Tipo de cuenta</label>
              <select class="form-select">
                <option value="cliente">Cliente (Quiero alquilar espacios)</option>
                <option value="propietario">Propietario (Quiero publicar locales)</option>
              </select>
            </div>
            <div class="mb-3">
              <label class="form-label small fw-bold">Contraseña</label>
              <input type="password" class="form-control" placeholder="••••••••" required>
            </div>
            <div class="mb-3 form-check">
              <input type="checkbox" class="form-check-input" id="terminos" required>
              <label class="form-check-label small" for="terminos">Acepto los términos y condiciones</label>
            </div>
            <button type="submit" class="btn btn-primary w-100 mb-3">Crear Cuenta</button>
            <p class="text-center small text-muted mb-0">
              ¿Ya tienes cuenta? <a href="login.html" class="text-decoration-none fw-bold">Inicia sesión</a>
            </p>
          </form>
        </div>
      </div>
    </div>
  </div>
</section>

<!-- pie de pagina / footer -->
<footer class="py-4">
  <div class="container text-center small text-muted">
    © 2026 SpaceHub. Todos los derechos reservados.
  </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
