<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Consulta de espacios · SpaceHub</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" th:href="@{/css/styles.css}"></head>
<body><th:block th:replace="~{fragments/header :: header('api')}"></th:block>
<main class="container py-5"><h1>Consulta de espacios</h1><p>Consulta el catálogo actualizado por categoría.</p>
<form id="consulta" th:attr="data-api=@{/api/v1/}"><label class="form-label" for="categoria-api">Categoría</label>
<select id="categoria-api" class="form-select mb-3"><option value="">Todas las categorías</option></select>
<button class="btn btn-primary" type="submit">Consultar</button></form>
<p id="estado-api" role="status" aria-live="polite" class="my-3"></p>
<div class="table-responsive"><table class="table"><caption>Resultados de la consulta</caption>
<thead><tr><th>Espacio</th><th>Distrito</th><th>Precio por hora</th><th>Capacidad</th><th>Estado</th></tr></thead><tbody id="resultados-api"></tbody></table></div>
</main><script th:src="@{/js/consulta-api.js}" defer></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script></body></html>
