<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar Sesión - SpaceHub</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>

<!-- barra de navegacion / navbar -->
<th:block th:replace="~{fragments/header :: header('login')}"></th:block>

<!-- formulario de inicio de sesion (card) -->
<section class="py-5">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-12 col-md-6 col-lg-4">
        <div class="card p-4">
          <div class="text-center mb-4">
            <i class="bi bi-person-circle fs-1 text-secondary"></i>
            <h3 class="mt-2">Iniciar Sesión</h3>
            <p class="text-muted small">Ingresa tus credenciales para acceder.</p>
          </div>

          <!-- Alerta de error si las credenciales fallan -->
          <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
            <i class="bi bi-exclamation-triangle-fill me-2"></i><span th:text="${error}">Error</span>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
          </div>

          <form th:action="@{/login}" method="POST">
            <div class="mb-3">
              <label class="form-label small fw-bold">Correo electrónico</label>
              <input type="email" name="correo" id="correoLogin" class="form-control" placeholder="usuario@correo.com" required>
            </div>
            <div class="mb-3">
              <label class="form-label small fw-bold">Contraseña</label>
              <input type="password" name="password" id="claveLogin" class="form-control" placeholder="••••••••" required>
            </div>
            <div class="mb-3 form-check">
              <input type="checkbox" class="form-check-input" id="recordar">
              <label class="form-check-label small" for="recordar">Recordar mi sesión</label>
            </div>
            <button type="submit" class="btn btn-primary w-100 mb-3">Ingresar</button>

            <div class="p-2 bg-light border rounded small text-center text-muted mb-3">
              <i class="bi bi-info-circle me-1"></i> Para ingresar al panel admin: usa <strong>admin@spacehub.pe</strong> / <strong>admin123</strong>
            </div>

            <p class="text-center small text-muted mb-0">
              ¿No tienes cuenta? <a th:href="@{/registro}" class="text-decoration-none fw-bold">Regístrate</a>
            </p>
          </form>
        </div>
      </div>
    </div>
  </div>
</section>

<!-- pie de pagina / footer -->
<footer th:replace="~{fragments/footer :: footer}"></footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
