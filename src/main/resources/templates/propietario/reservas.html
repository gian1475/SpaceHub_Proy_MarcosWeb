<!doctype html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Solicitudes recibidas · SpaceHub</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" th:href="@{/css/styles.css}"></head>
<body><th:block th:replace="~{fragments/header :: header('propietario')}"></th:block>
<main class="container py-4"><h1>Solicitudes recibidas</h1><a th:href="@{/propietario}">Volver a mis espacios</a>
<div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
<p th:if="${#lists.isEmpty(reservas)}" class="my-3">Tus espacios todavía no tienen solicitudes.</p>
<article th:each="r : ${reservas}" class="card p-3 my-3"><h2 class="h5" th:text="${r.servicio.nombre}"></h2>
<p><span th:text="${r.clienteNombre}"></span> · <span th:text="${r.fecha}"></span> · <span th:text="${r.horaInicio}"></span> a <span th:text="${r.horaFin}"></span></p>
<p><span th:text="${'S/ ' + #numbers.formatDecimal(r.total,1,'NONE',2,'POINT')}"></span> · <strong th:text="${r.estado}"></strong></p>
<form class="d-flex gap-2" method="post" th:action="@{/propietario/reservas/{id}/estado(id=${r.id})}"><input type="hidden" name="_csrf" th:value="${session.csrf}">
<label th:for="${'estado-' + r.id}" class="visually-hidden">Estado de solicitud</label><select th:id="${'estado-' + r.id}" class="form-select w-auto" name="estado"><option th:each="e : ${ {'Pendiente','Aprobada','Rechazada'} }" th:value="${e}" th:text="${e}" th:selected="${e == r.estado}"></option></select><button class="btn btn-primary">Actualizar</button></form></article>
</main><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script></body></html>
