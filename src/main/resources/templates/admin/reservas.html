<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reservas - SpaceHub</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>
<th:block th:replace="~{fragments/header :: header('admin')}"></th:block>
<main class="container py-4">
<div class="d-flex justify-content-between align-items-center flex-wrap gap-3 mb-4"><div><h1 class="h2">Reservas</h1><p class="text-muted mb-0">Gestiona las solicitudes de todos los clientes.</p></div><a class="btn btn-outline-dark" th:href="@{/administracion}">Volver al panel</a></div>
<div th:if="${error}" class="alert alert-danger" role="alert" th:text="${error}"></div>
<th:block th:replace="~{fragments/filtros-espacios :: filtros('/admin/reservas')}"></th:block>
<div class="card shadow-sm"><div class="table-responsive"><table class="table align-middle mb-0"><thead><tr><th>Código</th><th>Cliente</th><th>Espacio / categoría</th><th>Fecha y horario</th><th>Total</th><th>Estado</th><th>Acciones</th></tr></thead><tbody>
<tr th:if="${#lists.isEmpty(reservas)}"><td colspan="7" class="text-center py-4">Todavía no hay reservas.</td></tr>
<tr th:each="r : ${reservas}"><td class="text-nowrap" th:text="${'#RES-' + r.id}"></td><td><span th:text="${r.clienteNombre}"></span><br><small class="text-muted" th:text="${r.clienteCorreo}"></small></td><td><span th:text="${r.espacioNombre}"></span><br><small class="text-muted" th:text="${r.categoriaNombre}"></small></td>
<td class="text-nowrap"><span th:text="${#temporals.format(r.fecha,'dd/MM/yyyy')}"></span><br><small th:text="${#temporals.format(r.horaInicio,'HH:mm') + ' - ' + #temporals.format(r.horaFin,'HH:mm') + ' (' + r.duracionTexto + ')'}"></small></td>
<td class="text-nowrap" th:text="${'S/ ' + #numbers.formatDecimal(r.total,1,'NONE',2,'POINT')}"></td><td><span class="badge" th:classappend="${r.estado == 'Aprobada' ? 'bg-success' : (r.estado == 'Pendiente' ? 'bg-warning text-dark' : 'bg-danger')}" th:text="${r.estado}"></span></td>
<td><div class="d-flex gap-2 align-items-center flex-wrap">
<a class="btn btn-sm btn-outline-dark" th:href="@{/admin/reservas/editar/{id}(id=${r.id})}">Editar</a>
<form class="m-0" method="post" th:if="${r.estado != 'Aprobada'}" th:action="@{/admin/reservas/estado/{id}(id=${r.id})}"><input type="hidden" name="_csrf" th:value="${session.csrf}"><input type="hidden" name="estado" value="Aprobada"><button class="btn btn-sm btn-outline-success" type="submit">Aprobar</button></form>
<form class="m-0" method="post" th:if="${r.estado != 'Rechazada'}" th:action="@{/admin/reservas/estado/{id}(id=${r.id})}"><input type="hidden" name="_csrf" th:value="${session.csrf}"><input type="hidden" name="estado" value="Rechazada"><button class="btn btn-sm btn-outline-warning" type="submit">Rechazar</button></form>
<form class="m-0" method="post" th:action="@{/admin/reservas/eliminar/{id}(id=${r.id})}" onsubmit="return confirm('¿Eliminar definitivamente esta reserva? Desaparecerá también del historial del cliente.');"><input type="hidden" name="_csrf" th:value="${session.csrf}"><button class="btn btn-sm btn-outline-danger" type="submit">Eliminar</button></form>
</div></td></tr></tbody></table></div></div>
</main><th:block th:replace="~{fragments/footer :: footer}"></th:block><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script><script th:src="@{/js/filtros-espacios.js}"></script></body></html>
