<!doctype html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Usuarios · SpaceHub</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" th:href="@{/css/styles.css}"></head>
<body><th:block th:replace="~{fragments/header :: header('admin')}"></th:block><main class="container py-4">
<h1>Gestionar usuarios</h1><a th:href="@{/administracion}">Volver al panel</a>
<p class="text-muted mt-3">Administra roles y acceso. Desactivar una cuenta bloquea el login, las sesiones web y sus tokens.</p>
<div th:if="${error}" class="alert alert-danger" role="alert" th:text="${error}"></div>
<div class="table-responsive"><table class="table align-middle"><thead><tr><th>Usuario</th><th>Correo</th><th>Estado</th><th>Permisos</th></tr></thead><tbody>
<tr th:each="u : ${pagina.content}"><td th:text="${u.nombres + ' ' + u.apellidos}"></td><td th:text="${u.correo}"></td><td th:text="${u.activo ? 'Activo' : 'Desactivado'}"></td>
<td><form class="d-flex flex-wrap gap-2 align-items-center m-0" method="post" th:action="@{/admin/usuarios/{id}/guardar(id=${u.id})}">
<input type="hidden" name="_csrf" th:value="${session.csrf}"><label class="visually-hidden" th:for="${'rol-' + u.id}">Rol</label>
<select class="form-select w-auto" name="rol" th:id="${'rol-' + u.id}" th:disabled="${u.id == session.usuarioId}"><option th:each="r : ${ {'ADMIN','CLIENTE','PROPIETARIO'} }" th:value="${r}" th:text="${r}" th:selected="${r == u.rol.nombre}"></option></select>
<label><input type="checkbox" name="activo" value="true" th:checked="${u.activo}" th:disabled="${u.id == session.usuarioId}"> Activo</label>
<button class="btn btn-primary btn-sm" th:disabled="${u.id == session.usuarioId}">Guardar</button><small th:if="${u.id == session.usuarioId}">Tu cuenta</small></form></td></tr>
</tbody></table></div><nav class="d-flex gap-3" aria-label="Paginación"><a th:if="${pagina.hasPrevious()}" th:href="@{/admin/usuarios(pagina=${pagina.number-1})}">Anterior</a><a th:if="${pagina.hasNext()}" th:href="@{/admin/usuarios(pagina=${pagina.number+1})}">Siguiente</a></nav>
</main><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script></body></html>
