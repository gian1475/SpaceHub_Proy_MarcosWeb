<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reservas - SpaceHub</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>
<th:block th:replace="~{fragments/header :: header('admin')}"></th:block>
<main class="container py-4"><div class="row justify-content-center"><div class="col-lg-7"><a class="btn btn-link px-0 mb-3" th:href="@{/admin/reservas}">Volver a reservas</a><div class="card p-4"><h1 class="h3 mb-3" th:text="${'Editar reserva #RES-' + reserva.id}"></h1>
<p><strong th:text="${reserva.clienteNombre}"></strong><br><span th:text="${reserva.clienteCorreo}"></span><br><span th:text="${reserva.servicio.nombre}"></span></p>
<p class="small text-muted">Al cambiar la fecha o el horario se recalcula el total con la tarifa actual. Si solo cambias el estado, se conserva el importe.</p>
<form method="post" th:action="@{/admin/reservas/guardar}" th:object="${reservaForm}"><input type="hidden" name="_csrf" th:value="${session.csrf}"><input type="hidden" th:field="*{id}">
<div th:if="${#fields.hasAnyErrors()}" class="alert alert-danger" role="alert"><ul class="mb-0"><li th:each="err : ${#fields.allErrors()}" th:text="${err}"></li></ul></div>
<div class="mb-3"><label class="form-label" for="fecha">Fecha</label><input class="form-control" th:errorclass="is-invalid" th:field="*{fecha}" type="date" required><div class="invalid-feedback" th:errors="*{fecha}"></div></div><div class="mb-3"><label class="form-label" for="horaInicio">Hora inicial</label><input class="form-control" th:errorclass="is-invalid" th:field="*{horaInicio}" type="time" required><div class="invalid-feedback" th:errors="*{horaInicio}"></div></div><div class="mb-3"><label class="form-label" for="horaFin">Hora final</label><input class="form-control" th:errorclass="is-invalid" th:field="*{horaFin}" type="time" required><div class="invalid-feedback" th:errors="*{horaFin}"></div></div><div class="mb-4"><label class="form-label" for="estado">Estado</label><select class="form-select" th:field="*{estado}" required><option value="Pendiente">Pendiente</option><option value="Aprobada">Aprobada</option><option value="Rechazada">Rechazada</option></select></div><div class="d-flex gap-2"><button class="btn btn-primary" type="submit">Guardar reserva</button><a class="btn btn-outline-secondary" th:href="@{/admin/reservas}">Cancelar</a></div></form></div></div></div></main><th:block th:replace="~{fragments/footer :: footer}"></th:block><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script></body></html>
