<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Categorías - SpaceHub</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>
<th:block th:replace="~{fragments/header :: header('admin')}"></th:block>
<main class="container py-4">
  <div class="d-flex flex-wrap gap-3 justify-content-between align-items-center mb-4">
    <div><h1 class="h2">Categorías</h1><p class="text-muted mb-0">Organiza los tipos de espacios del catálogo.</p></div>
    <div class="d-flex gap-2"><a class="btn btn-outline-dark" th:href="@{/administracion}">Volver al panel</a>
      <a class="btn btn-primary" th:href="@{/admin/categorias/nueva}"><i class="bi bi-plus-circle me-1"></i>Nueva categoría</a></div>
  </div>
  <div th:if="${error}" class="alert alert-danger" role="alert" th:text="${error}"></div>
  <div class="card shadow-sm"><div class="table-responsive">
    <table class="table align-middle mb-0">
      <thead><tr><th>ID</th><th>Nombre</th><th>Icono</th><th>Descripción</th><th>Acciones</th></tr></thead>
      <tbody>
        <tr th:if="${#lists.isEmpty(categorias)}"><td colspan="5" class="text-center text-muted py-4">Todavía no hay categorías. Registra la primera.</td></tr>
        <tr th:each="c : ${categorias}">
          <td th:text="${c.id}"></td><td class="fw-semibold" th:text="${c.nombre}"></td>
          <td><i class="bi" th:classappend="${c.icono}" aria-hidden="true"></i> <span th:text="${c.icono}"></span></td>
          <td th:text="${c.descripcion}"></td>
          <td><div class="d-flex align-items-center gap-2 flex-nowrap">
            <a class="btn btn-sm btn-outline-dark" th:href="@{/admin/categorias/editar/{id}(id=${c.id})}">Editar</a>
            <form class="m-0" method="post" th:action="@{/admin/categorias/eliminar/{id}(id=${c.id})}" onsubmit="return confirm('¿Eliminar esta categoría? Esta acción no se puede deshacer.');">
<input type="hidden" name="_csrf" th:value="${session.csrf}">
              <button class="btn btn-sm btn-outline-danger" type="submit">Eliminar</button>
            </form>
          </div></td>
        </tr>
      </tbody>
    </table>
  </div></div>
</main>
<th:block th:replace="~{fragments/footer :: footer}"></th:block>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
