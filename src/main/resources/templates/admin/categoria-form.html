<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Categorías - SpaceHub</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>
<th:block th:replace="~{fragments/header :: header('admin')}"></th:block>
<main class="container py-4">
  <div class="row justify-content-center"><div class="col-lg-7">
    <a class="btn btn-link px-0 mb-3" th:href="@{/admin/categorias}">Volver a categorías</a>
    <div class="card shadow-sm"><div class="card-body p-4">
      <h1 class="h3 mb-4" th:text="${categoria.id == null ? 'Nueva categoría' : 'Editar categoría'}"></h1>
      <form method="post" th:action="@{/admin/categorias/guardar}" th:object="${categoria}">
<input type="hidden" name="_csrf" th:value="${session.csrf}">
        <input type="hidden" th:field="*{id}">
        <div class="mb-3">
          <label for="nombre" class="form-label">Nombre *</label>
          <input class="form-control" th:errorclass="is-invalid" type="text" th:field="*{nombre}" required minlength="3" maxlength="50" aria-describedby="nombreError">
          <div id="nombreError" class="invalid-feedback" th:errors="*{nombre}"></div>
        </div>
        <div class="mb-3">
          <label for="icono" class="form-label">Icono</label>
          <input class="form-control" th:errorclass="is-invalid" type="text" th:field="*{icono}" maxlength="50" placeholder="bi-building" aria-describedby="iconoAyuda iconoError">
          <div id="iconoAyuda" class="form-text">Opcional. Usa una clase de Bootstrap Icons, como bi-building o bi-laptop.</div>
          <div id="iconoError" class="invalid-feedback" th:errors="*{icono}"></div>
        </div>
        <div class="mb-4">
          <label for="descripcion" class="form-label">Descripción</label>
          <textarea class="form-control" th:errorclass="is-invalid" th:field="*{descripcion}" rows="3" maxlength="200" aria-describedby="descripcionError"></textarea>
          <div id="descripcionError" class="invalid-feedback" th:errors="*{descripcion}"></div>
        </div>
        <div class="d-flex gap-2"><button class="btn btn-primary" type="submit">Guardar categoría</button>
          <a class="btn btn-outline-secondary" th:href="@{/admin/categorias}">Cancelar</a></div>
      </form>
    </div></div>
  </div></div>
</main>
<th:block th:replace="~{fragments/footer :: footer}"></th:block>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
