<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Catálogo de Espacios - SpaceHub</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>

<!-- barra de navegacion / navbar -->
<th:block th:replace="~{fragments/header :: header('servicios')}"></th:block>

<!-- seccion del catalogo -->
<section class="py-5">
  <div class="container">
    <div class="text-center mb-4">
      <h1>Catálogo de Espacios</h1>
      <p class="lead text-muted">Explora todos los locales disponibles para alquilar en Lima.</p>
    </div>

    <!-- buscador en vivo con javascript -->
    <div class="row justify-content-center mb-4">
      <div class="col-12 col-md-6">
        <div class="input-group shadow-sm">
          <span class="input-group-text bg-white"><i class="bi bi-search text-muted"></i></span>
          <input type="text" id="inputBuscar" class="form-control" placeholder="Buscar por nombre, distrito o categoría..." onkeyup="buscarLocal()">
        </div>
      </div>
    </div>

    <!-- botones de filtro por categoria -->
    <div class="d-flex justify-content-center flex-wrap gap-2 mb-5">
      <a th:href="@{/servicios}"
         class="btn btn-sm"
         th:classappend="${categoriaActiva == 'Todos' or categoriaActiva == null or categoriaActiva == ''} ? 'btn-dark' : 'btn-outline-dark'">
        Todos
      </a>
      <a th:each="cat : ${categorias}"
         th:href="@{/servicios(categoria=${cat.nombre})}"
         class="btn btn-sm"
         th:classappend="${categoriaActiva == cat.nombre} ? 'btn-dark' : 'btn-outline-dark'"
         th:text="${cat.nombre}">
        Categoría
      </a>
    </div>

    <!-- mensaje si no hay resultados -->
    <div th:if="${#lists.isEmpty(servicios)}" class="text-center py-5">
      <i class="bi bi-exclamation-circle fs-1 text-muted d-block mb-3"></i>
      <h4 class="text-muted">No se encontraron espacios para la categoría seleccionada.</h4>
      <a th:href="@{/servicios}" class="btn btn-primary mt-2">Ver todos los espacios</a>
    </div>

    <!-- listado de espacios en tarjetas / cards -->
    <div class="row g-4" th:unless="${#lists.isEmpty(servicios)}">
      <div class="col-12 col-md-6 col-lg-4" th:each="s : ${servicios}">
        <div class="card h-100">
          <img th:src="${s.imagenes[0]}" class="card-img-top" th:alt="${s.nombre}">
          <div class="card-body d-flex flex-column">
            <span class="badge bg-secondary mb-2 align-self-start" th:text="${s.categoria.nombre}">Categoría</span>
            <h5 class="card-title" th:text="${s.nombre}">Nombre del espacio</h5>
            <p class="text-muted small"><i class="bi bi-geo-alt"></i> <span th:text="${s.distrito + ', Lima'}">Distrito, Lima</span></p>
            <p class="card-text small text-muted" th:text="${s.descripcionCorta}">
              Descripción corta del espacio.
            </p>
            <p class="fw-bold fs-5 mt-auto mb-3">
              S/. <span th:text="${#numbers.formatDecimal(s.precioPorHora,1,'NONE',2,'POINT')}">45.00</span> <span class="small fw-normal text-muted">/ hora</span>
            </p>
            <a th:href="@{/servicios/{id}(id=${s.id})}" class="btn btn-primary w-100">Ver detalle</a>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>

<!-- pie de pagina / footer -->
<footer th:replace="~{fragments/footer :: footer}"></footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/script.js}"></script>
</body>
</html>
