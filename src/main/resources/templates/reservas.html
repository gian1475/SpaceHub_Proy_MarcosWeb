<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mis Reservas - SpaceHub</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>

<!-- barra de navegacion / navbar -->
<th:block th:replace="~{fragments/header :: header('reservas')}"></th:block>

<!-- contenido principal de reservas -->
<section class="py-4">
  <div class="container">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <div>
        <h1 class="h2 mb-0">Solicitudes de Reserva</h1>
        <p class="text-muted small mb-0">Historial de solicitudes de tu cuenta.</p>
      </div>
      <a th:href="@{/servicios}" class="btn btn-primary">
        <i class="bi bi-plus-circle me-1"></i> Nueva Reserva
      </a>
    </div>

    <!-- tabla de reservas -->
    <div class="card shadow-sm">
      <div class="card-header bg-white py-3">
        <h5 class="mb-0"><i class="bi bi-calendar-check me-2"></i> Mis Reservas</h5>
      </div>
      <div class="table-responsive">
        <table class="table table-hover align-middle mb-0">
          <thead class="table-light">
            <tr>
              <th>Código</th>
              <th>Cliente</th>
              <th>Espacio</th>
              <th>Fecha</th>
              <th>Horas</th>
              <th>Total</th>
              <th>Estado</th>
            </tr>
          </thead>
          <tbody>
            <tr th:if="${#lists.isEmpty(reservas)}">
              <td colspan="7" class="text-center py-4 text-muted">
                No hay reservas registradas. <a th:href="@{/servicios}">Explora el catálogo</a> para solicitar una.
              </td>
            </tr>
            <tr th:each="r : ${reservas}">
              <td><strong th:text="${'#RES-' + r.id}">#RES-101</strong></td>
              <td th:text="${r.clienteNombre}">Gerardo Guevara</td>
              <td th:text="${r.servicio.nombre}">Rooftop Sunset Miraflores</td>
              <td th:text="${#temporals.format(r.fecha, 'dd/MM/yyyy')}">12/09/2026</td>
              <td th:text="${r.duracionTexto}">4 hrs</td>
              <td><strong th:text="${'S/ ' + #numbers.formatDecimal(r.total,1,'NONE',2,'POINT')}">S/ 760.00</strong></td>
              <td>
                <span class="badge"
                      th:classappend="${r.estado == 'Aprobada'} ? 'bg-success' : (${r.estado == 'Pendiente'} ? 'bg-warning text-dark' : 'bg-danger')"
                      th:text="${r.estado}">
                  Aprobada
                </span>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</section>

<!-- pie de pagina / footer -->
<footer th:replace="~{fragments/footer :: footer}"></footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
