spring.application.name=spacehub
server.port=8080
spring.thymeleaf.cache=false

spring.datasource.url=${SPACEHUB_DB_URL:jdbc:mysql://localhost:3306/spacehub_db}
spring.datasource.username=${SPACEHUB_DB_USER:root}
spring.datasource.password=${SPACEHUB_DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=${SPACEHUB_SHOW_SQL:false}
spring.sql.init.mode=never

server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
